title: Wo und wann?
summary: Mr Hill stellt den Lagerraum fürs Schulfest zusammen. Du lernst, mit in, on, under, next to und behind zu sagen, wo etwas steht, mit there is und there are, was es gibt, und mit at, on und in, wann etwas ist.
