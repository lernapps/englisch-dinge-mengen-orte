# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du hier
description: Das simple present noch einmal kurz, bevor die Klasse die Schülerzeitung „Millbrook News“ macht.
recap: englisch/simple-present
scope: "Die Seite wiederholt nur das simple present (I like, he likes) mit dem -s bei he, she und it. Neue Inhalte und eine Übung gibt es nicht. Sie bereitet die Verbformen bei news, information, advice und police vor."
blocks:
  - type: section
    id: einstieg
    title: Das solltest du schon können
    blocks:
      - type: text
        text: "Zwei Jahre später: Sophie ist jetzt 13 und lebt noch immer bei den Parkers. Ellie (13), Amir (13) und Peter (11) schreiben mit ihr für die Schülerzeitung „Millbrook News“. Mr Hill, ihr Englischlehrer, korrigiert die Artikel. In den nächsten Texten geht es um Etiketten und um Verben. Die Verben kennst du schon, prüfe sie in Gedanken."
      - type: text
        text: "**Ich kann im simple present über Gewohnheiten und Tatsachen sprechen und das -s bei he, she, it anhängen.** Du brauchst das bei „news“ und „police“, denn bei news und police musst du entscheiden, ob das Verb ein -s bekommt. Wiederhole es auf der [Seite zum simple present](https://lernapps.net/apps/map/englisch/c/simple-present/) der Lernlandkarte."
      - type: table
        caption: Klassenzimmer-Poster · Das simple present
        header: [Person, Verb]
        rows:
          - [I, I read]
          - [you, you read]
          - [he / she / it, he reads]
          - [we, we read]
          - [they, they read]
      - type: text
        text: "Nur bei **he, she** und **it** (und bei einer einzelnen Person oder einem einzelnen Ding wie Sophie oder the dog) hängt ein **-s** am Verb. Alle anderen Personen haben die Grundform. Merke dir den Satz: „He, she, it – das s muss mit.“ Gleich geht es darum, welches Verb zu welchem Nomen gehört."
