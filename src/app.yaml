format: 2
strand: englisch/grammatik
title: Dinge, Mengen und Orte
intro: Mr Hill lässt die Klasse den Lagerraum der Millbrook School für das Schulfest ordnen. Sophie (11, aus Deutschland), Ellie (11), ihr Bruder Peter (9) und Amir (11) füllen Kisten und Gläser, kleben Etiketten darauf und stellen alles ins Regal. Du lernst dabei, wie du auf Englisch Dinge benennst, Mengen angibst und sagst, wo und wann etwas ist.
languages: [de]
scope:
  text: Die App erklärt für Kinder im ersten und zweiten Lernjahr Englisch, wie man Nomen mit dem passenden Begleiter benennt und wo und wann etwas ist. Zählbare Dinge liegen in Kisten (one apple, two apples), Nicht-Zählbares in Gläsern (water, rice). Begleiter sind Etiketten auf Kiste oder Glas. Gelernt werden a, an und the, der Plural, der s-Genitiv und of, this, that, these und those, much, many, some und any, Mengenangaben mit of, there is und there are sowie in, on und at für Ort und Zeit. Beispiele stammen aus dem Alltag von Sophie, Ellie, Peter und Amir.
  out:
    - Possessivbegleiter wie my und your (steht im Explainer „Pronomen“)
    - Adjektive und das Stützwort one (steht im Explainer „Adjektive und Adverbien“)
    - Phrasal verbs (steht im Explainer „Phrasal verbs“)
    - Gebrauch des bestimmten Artikels und Nomen wie news und police (Stufe 7-8, später)
chapters: [ein-ding-viele-dinge]
