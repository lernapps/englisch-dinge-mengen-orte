format: 2
strand: englisch/grammatik
title: Dinge, Mengen und Orte
intro: Mr Hill, der Englischlehrer, lässt die Klasse den Lagerraum der Millbrook School für das Schulfest ordnen. Sophie, Ellie, Peter und Amir füllen Kisten und Gläser, kleben Etiketten darauf und stellen alles ins Regal. Du lernst dabei, wie du auf Englisch Dinge benennst, Mengen angibst und sagst, wo und wann etwas ist.
languages: [de]
scope:
  text: Die App erklärt für Kinder ab dem ersten Lernjahr Englisch (Kapitel 1 bis 3 für Klasse 5-6, Kapitel 4 für Klasse 7-8), wie man Nomen mit dem passenden Begleiter benennt und wo und wann etwas ist. Zählbare Dinge liegen in Kisten (one apple, two apples), Nicht-Zählbares in Gläsern (water, rice). Begleiter sind Etiketten auf Kiste oder Glas. Gelernt werden a, an und the, der Plural, der s-Genitiv und of, this, that, these und those, much, many, some und any, Mengenangaben mit of, there is und there are sowie in, on und at für Ort und Zeit. Im vierten Kapitel (Klasse 7-8) lernen die Kinder, wann kein „the“ steht, und wie sie news, information, advice und police mit dem richtigen Verb verbinden. Beispiele stammen aus dem Alltag von Sophie, Ellie, Peter und Amir.
  out:
    - Possessivbegleiter wie my und your (steht im Explainer „Pronomen“)
    - Adjektive und das Stützwort one (steht im Explainer „Adjektive und Adverbien“)
    - Phrasal verbs (steht im Explainer „Phrasal verbs“)
chapters: [ein-ding-viele-dinge, wie-viel-wie-viele, wo-und-wann, ohne-etikett]
